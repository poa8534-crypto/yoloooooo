[project]
name = "roblox-venture-agents"
version = "0.1.0"
description = "Local evidence-first Roblox research agents"
requires-python = ">=3.12"
dependencies = [
  "apscheduler>=3.10,<4",
  "beautifulsoup4>=4.12,<5",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "numpy>=2.1,<3",
  "pydantic-settings>=2.6,<3",
  "scikit-learn>=1.6,<2",
  "sqlalchemy>=2.0,<3",
  "tldextract>=5.1,<6",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
]
embeddings = ["fastembed>=0.7,<1"]

[project.scripts]
venture-agents = "app.main:run"
venture-calibrate = "app.calibration:main"
venture-assoc-benchmark = "app.association.benchmark:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.hatch.build.targets.wheel.force-include]
"app/association/data/seed_dataset.json" = "app/association/data/seed_dataset.json"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff.lint.per-file-ignores]
"app/main.py" = ["B008"]
"app/workflows.py" = ["BLE001"]
# The research controller must degrade on any connector or model failure
# and record it, rather than aborting a 30-minute run.
"app/deep_research.py" = ["BLE001"]
